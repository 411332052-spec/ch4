[project]
name = "foodlog"
version = "0.1.0"
description = "Discord 食物照片記錄 agent：用 claude -p 分析照片、記進 Excel、回覆上傳者"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
foodlog = "foodlog.__main__:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
